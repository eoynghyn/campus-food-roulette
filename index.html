<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>세종캠 점심 룰렛</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>🎲 세종캠 점심 룰렛</h1>
      <p class="sub">고려대 세종캠퍼스 근처, 오늘 뭐 먹지?</p>
    </header>

    <fieldset class="card" id="filters">
      <div class="group">
        <h2>1인 예산</h2>
        <div class="chips">
          <label><input type="radio" name="budget" value="0" checked><span>상관없음</span></label>
          <label><input type="radio" name="budget" value="7000"><span>7천원 이하</span></label>
          <label><input type="radio" name="budget" value="10000"><span>1만원 이하</span></label>
          <label><input type="radio" name="budget" value="15000"><span>1.5만원 이하</span></label>
        </div>
      </div>
      <div class="group">
        <h2>오늘의 기분 <small>(여러 개 선택 가능)</small></h2>
        <div class="chips">
          <label><input type="checkbox" name="mood" value="spicy"><span>🌶️ 매운</span></label>
          <label><input type="checkbox" name="mood" value="quick"><span>⚡ 빠른</span></label>
          <label><input type="checkbox" name="mood" value="hearty"><span>🍚 든든한</span></label>
          <label><input type="checkbox" name="mood" value="babyak"><span>🤝 밥약</span></label>
        </div>
      </div>
    </fieldset>

    <section class="card wheel-card">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="600" height="600" aria-label="식당 룰렛"></canvas>
      </div>
      <p id="match-count" class="match-count"></p>
      <button id="override" class="text-btn" hidden>최근 기록 무시하고 돌리기</button>
      <button id="spin" class="spin">룰렛 돌리기</button>
    </section>

    <section class="card result" id="result" hidden aria-live="polite"></section>

    <section class="card" id="history" hidden>
      <div class="history-head">
        <h2>최근 뽑힌 식당 <small>(최근 2번은 룰렛에서 빠져요)</small></h2>
        <button id="clear-history" class="text-btn">기록 지우기</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </section>
  </main>

  <script src="restaurants.js"></script>
  <script src="app.js"></script>
</body>
</html>
